# nginx front for the Isis MCP server (Isis.McpServer, Voltaic streamable HTTP + SSE).
# Mounted into the nginx-mcp container at /etc/nginx/conf.d/default.conf.
#
# Streamable HTTP / SSE passthrough requirements:
#   - proxy_http_version 1.1 and an empty Connection header keep the upstream connection open for
#     server-sent events (the default "close"/keep-alive juggling breaks long-lived SSE streams).
#   - proxy_buffering off flushes each event to the client immediately instead of batching.
#   - long read/send timeouts prevent nginx from cutting an idle-but-open event stream.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream isis_mcp {
    server isis-mcp:8720;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 32m;

    location / {
        proxy_pass http://isis_mcp;

        # HTTP/1.1 with an empty Connection header for SSE / streamable HTTP keep-alive.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Also honor WebSocket-style upgrades if a client negotiates one.
        proxy_set_header Upgrade $http_upgrade;

        # Stream events straight through, no buffering, no chunk re-encoding.
        proxy_buffering            off;
        proxy_cache                off;
        chunked_transfer_encoding  off;

        # Keep long-lived streams open (1 hour idle).
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
