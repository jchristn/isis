# nginx front for the Isis REST server (Isis.Server).
# Independent of the MCP front so REST and MCP can scale / TLS-terminate separately.
# Mounted into the nginx-rest container at /etc/nginx/conf.d/default.conf.

upstream isis_rest {
    server isis-server:8700;
}

server {
    listen 80;
    server_name _;

    # Standard reverse-proxy headers so Watson sees the real client and scheme.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Generous body size for memory bodies / seed packs.
    client_max_body_size 32m;

    location / {
        proxy_pass http://isis_rest;
    }
}
