apiVersion: 1

# Dashboards are NOT provisioned from files here. Grafana 13's file provisioner cannot build a nested
# folder hierarchy (foldersFromFilesStructure only creates a single flat folder per dashboard, and the
# `folder` field can't nest). To get a single top-level "Isis" folder with nested category subfolders,
# the one-shot `grafana-init` service uploads the dashboards through the Grafana HTTP API instead (see
# docker/grafana/provision-folders.sh). Leaving no providers here avoids creating duplicate flat folders.
providers: []
