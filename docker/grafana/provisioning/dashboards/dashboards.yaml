apiVersion: 1

# Load all Isis dashboards directly into a single top-level "Isis" folder (no subfolders).
# foldersFromFilesStructure is off, so every dashboard under the mounted path lands in the `folder` below.
providers:
  - name: 'Isis'
    orgId: 1
    folder: 'Isis'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards/isis
      foldersFromFilesStructure: false
