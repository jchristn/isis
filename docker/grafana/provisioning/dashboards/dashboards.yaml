apiVersion: 1

# Load the Isis dashboard JSON (mounted from assets/grafana) into categorized Grafana folders.
# Each subdirectory of the dashboards path (Overview, API, Services, Storage, Runtime) becomes its
# own Grafana folder via foldersFromFilesStructure, rather than piling everything into one folder
# or one mega-dashboard.
providers:
  - name: 'Isis'
    orgId: 1
    folder: 'Isis'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards/isis
      foldersFromFilesStructure: true
